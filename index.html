<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Little">
<meta name="theme-color" content="#e8eef8">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<title>Little</title>
<style>
:root {
  --bg: #f0f4fd;
  --surface: #ffffff;
  --surface2: #e8eef8;
  --primary: #7aa2d4;
  --primary-light: #d0dff2;
  --accent: #f4b8c1;
  --accent2: #a8d8cb;
  --accent3: #f7d794;
  --text: #3a4458;
  --text-light: #8a92a8;
  --text-white: #ffffff;
  --shadow: rgba(122, 162, 212, 0.12);
  --radius: 16px;
  --radius-sm: 10px;
  --safe-top: env(safe-area-inset-top);
  --safe-bottom: env(safe-area-inset-bottom);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family: -apple-system,'SF Pro Text','PingFang SC',sans-serif;
  background:var(--bg); color:var(--text);
  height:100vh; height:100dvh; overflow:hidden;
  display:flex; flex-direction:column;
}

/* 顶栏 */
.header {
  display:flex; align-items:center; justify-content:space-between;
  padding:calc(var(--safe-top) + 8px) 16px 8px;
  background:var(--surface); border-bottom:1px solid var(--primary-light);
  min-height:52px; z-index:100;
}
.header-title { font-size:17px; font-weight:600; color:var(--text); flex:1; text-align:center; }
.header-btn {
  width:36px; height:36px; border:none; background:var(--surface2);
  border-radius:50%; font-size:18px; display:flex; align-items:center;
  justify-content:center; cursor:pointer; transition:transform .15s;
}
.header-btn:active { transform:scale(.9); }

/* 侧栏 */
.sidebar-overlay {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,.3); z-index:200;
}
.sidebar-overlay.open { display:block; }
.sidebar {
  position:fixed; left:-280px; top:0; bottom:0; width:280px;
  background:var(--surface); z-index:201;
  transition:left .28s cubic-bezier(.4,0,.2,1);
  display:flex; flex-direction:column;
  padding-top:calc(var(--safe-top) + 12px);
}
.sidebar.open { left:0; }
.sidebar-header { display:flex; align-items:center; justify-content:space-between; padding:8px 16px 16px; }
.sidebar-header h2 { font-size:20px; color:var(--text); }
.new-chat-btn {
  width:36px; height:36px; border:none; background:var(--primary);
  color:var(--text-white); border-radius:50%; font-size:20px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.chat-list { flex:1; overflow-y:auto; padding:0 12px; -webkit-overflow-scrolling:touch; }
.chat-item {
  padding:12px; margin-bottom:4px; border-radius:var(--radius-sm);
  cursor:pointer; display:flex; align-items:center; justify-content:space-between;
  transition:background .15s;
}
.chat-item:active, .chat-item.active { background:var(--primary-light); }
.chat-item-title {
  font-size:14px; color:var(--text); flex:1;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.chat-item-del {
  width:24px; height:24px; border:none; background:none;
  color:var(--text-light); font-size:14px; cursor:pointer;
  border-radius:50%; display:flex; align-items:center; justify-content:center; opacity:.5; flex-shrink:0;
}

/* 聊天区域 */
.chat-area {
  flex:1; overflow-y:auto; padding:12px 16px 8px;
  -webkit-overflow-scrolling:touch; scroll-behavior:smooth;
}
.msg { display:flex; margin-bottom:12px; max-width:100%; }
.msg.user { justify-content:flex-end; }
.msg.assistant { justify-content:flex-start; }
.msg-bubble {
  max-width:82%; padding:10px 14px; border-radius:var(--radius);
  font-size:15px; line-height:1.55; word-break:break-word; white-space:pre-wrap; position:relative;
}
.msg.user .msg-bubble {
  background:var(--primary); color:var(--text-white); border-bottom-right-radius:4px;
}
.msg.assistant .msg-bubble {
  background:var(--surface); color:var(--text); border-bottom-left-radius:4px;
  box-shadow:0 1px 4px var(--shadow);
}
.msg-time { font-size:10px; color:var(--text-light); margin-top:4px; opacity:.7; }
.msg.user .msg-time { text-align:right; }

/* 思维链折叠行 */
.thinking-toggle {
  display:flex; align-items:center; gap:6px;
  padding:6px 0; margin-bottom:2px; cursor:pointer;
  font-size:13px; color:var(--text-light); max-width:82%;
  -webkit-user-select:none; user-select:none;
}
.thinking-toggle:active { opacity:.6; }
.thinking-label { font-weight:600; color:#999; flex-shrink:0; }
.thinking-preview {
  flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.thinking-arrow { flex-shrink:0; font-size:12px; color:#bbb; }

.typing-indicator {
  display:none; padding:10px 14px; background:var(--surface);
  border-radius:var(--radius); border-bottom-left-radius:4px;
  box-shadow:0 1px 4px var(--shadow); width:fit-content; margin-bottom:12px;
}
.typing-indicator.show { display:block; }
.typing-dot {
  display:inline-block; width:7px; height:7px; border-radius:50%;
  background:var(--primary); margin:0 2px; animation:bounce 1.2s infinite;
}
.typing-dot:nth-child(2) { animation-delay:.2s; }
.typing-dot:nth-child(3) { animation-delay:.4s; }
@keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }

/* 输入区 */
.input-area {
  padding:8px 12px calc(var(--safe-bottom) + 8px);
  background:var(--surface); border-top:1px solid var(--primary-light);
  display:flex; align-items:flex-end; gap:8px;
}
.input-wrap {
  flex:1; background:var(--surface2); border-radius:20px;
  padding:8px 16px; display:flex; align-items:flex-end;
}
.input-wrap textarea {
  flex:1; border:none; background:none; font-size:15px; color:var(--text);
  resize:none; outline:none; max-height:120px; line-height:1.4; font-family:inherit;
}
.send-btn {
  width:40px; height:40px; border:none; background:var(--primary);
  color:var(--text-white); border-radius:50%; font-size:18px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:transform .15s,opacity .15s; flex-shrink:0;
}
.send-btn:active { transform:scale(.9); }
.send-btn:disabled { opacity:.5; }

/* 通用全屏浮层 */
.overlay-page {
  display:none; position:fixed; inset:0;
  background:var(--bg); z-index:300;
  flex-direction:column; padding-top:calc(var(--safe-top) + 8px);
}
.overlay-page.open { display:flex; }
.overlay-header { display:flex; align-items:center; padding:8px 16px 16px; gap:12px; }
.overlay-header h2 { font-size:20px; flex:1; }
.overlay-back {
  width:36px; height:36px; border:none; background:var(--surface);
  border-radius:50%; font-size:18px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.overlay-body { flex:1; overflow-y:auto; padding:0 16px 32px; -webkit-overflow-scrolling:touch; }

/* 设置 */
.settings-group {
  background:var(--surface); border-radius:var(--radius); padding:16px; margin-bottom:16px;
}
.settings-group h3 {
  font-size:13px; color:var(--text-light); text-transform:uppercase;
  letter-spacing:.5px; margin-bottom:12px;
}
.setting-row { margin-bottom:12px; }
.setting-row:last-child { margin-bottom:0; }
.setting-row label { display:block; font-size:14px; font-weight:500; margin-bottom:6px; color:var(--text); }
.setting-row input,.setting-row textarea,.setting-row select {
  width:100%; padding:10px 12px; border:1.5px solid var(--primary-light);
  border-radius:var(--radius-sm); font-size:14px; color:var(--text);
  background:var(--bg); outline:none; font-family:inherit; transition:border-color .2s;
}
.setting-row input:focus,.setting-row textarea:focus { border-color:var(--primary); }
.setting-row textarea { min-height:80px; resize:vertical; }
.save-btn {
  width:100%; padding:14px; border:none; background:var(--primary);
  color:var(--text-white); border-radius:var(--radius); font-size:16px;
  font-weight:600; cursor:pointer; margin-top:8px;
}

/* 模型选择行 */
.model-row { display:flex; gap:8px; align-items:flex-start; }
.model-row input { flex:1; }
.fetch-model-btn {
  padding:10px 14px; border:none; background:var(--primary);
  color:var(--text-white); border-radius:var(--radius-sm); font-size:13px;
  font-weight:600; cursor:pointer; white-space:nowrap; flex-shrink:0;
  transition:transform .15s, opacity .15s;
}
.fetch-model-btn:active { transform:scale(.95); }
.fetch-model-btn:disabled { opacity:.5; }

/* 模型选择页 */
.model-search-wrap {
  position:sticky; top:0; background:var(--bg); padding:0 0 12px; z-index:10;
}
.model-search-wrap input {
  width:100%; padding:10px 14px; border:1.5px solid var(--primary-light);
  border-radius:20px; font-size:14px; color:var(--text);
  background:var(--surface); outline:none;
}
.model-search-wrap input:focus { border-color:var(--primary); }
.model-list-item {
  padding:14px 16px; background:var(--surface); border-radius:var(--radius-sm);
  margin-bottom:6px; font-size:14px; color:var(--text); cursor:pointer;
  transition:background .15s; word-break:break-all; line-height:1.4;
}
.model-list-item:active { background:var(--primary-light); }
.model-list-item.current { border:2px solid var(--primary); background:var(--primary-light); }
.model-list-empty { text-align:center; color:var(--text-light); padding:40px; font-size:14px; }

/* 记忆库 */
.memory-item {
  background:var(--surface); border-radius:var(--radius-sm);
  padding:12px; margin-bottom:8px; font-size:14px; line-height:1.5;
  display:flex; justify-content:space-between; align-items:flex-start; gap:8px;
}
.memory-item-text { flex:1; }
.memory-item-meta { font-size:11px; color:var(--text-light); margin-top:4px; }
.memory-tag {
  display:inline-block; font-size:10px; padding:2px 6px; border-radius:8px;
  color:var(--text-white); margin-right:4px;
}
.memory-tag.profile { background:#7aa2d4; }
.memory-tag.warm { background:#f4b8c1; }
.memory-tag.fact { background:#a8d8cb; }
.memory-tag.corridor { background:#f7d794; color:var(--text); }
.memory-item-del {
  width:24px; height:24px; border:none; background:var(--accent);
  color:var(--text-white); border-radius:50%; font-size:12px; cursor:pointer;
  flex-shrink:0; display:flex; align-items:center; justify-content:center;
}
.memory-empty { text-align:center; color:var(--text-light); padding:40px; font-size:14px; }
.memory-stats {
  background:var(--surface); border-radius:var(--radius); padding:14px;
  margin-bottom:16px; display:flex; justify-content:space-around; text-align:center;
}
.memory-stat-num { font-size:22px; font-weight:700; color:var(--primary); }
.memory-stat-label { font-size:11px; color:var(--text-light); margin-top:2px; }

/* 手动添加记忆 */
.memory-add-box {
  background:var(--surface); border-radius:var(--radius); padding:14px;
  margin-bottom:16px;
}
.memory-add-box h3 {
  font-size:13px; color:var(--text-light); text-transform:uppercase;
  letter-spacing:.5px; margin-bottom:10px;
}
.memory-add-row { display:flex; gap:8px; margin-bottom:8px; }
.memory-add-row select {
  width:100px; padding:8px 6px; border:1.5px solid var(--primary-light);
  border-radius:var(--radius-sm); font-size:13px; color:var(--text);
  background:var(--bg); outline:none; flex-shrink:0;
}
.memory-add-row textarea {
  flex:1; padding:8px 10px; border:1.5px solid var(--primary-light);
  border-radius:var(--radius-sm); font-size:13px; color:var(--text);
  background:var(--bg); outline:none; font-family:inherit;
  resize:vertical; min-height:40px; max-height:100px;
}
.memory-add-row textarea:focus, .memory-add-row select:focus { border-color:var(--primary); }
.memory-add-btn {
  padding:8px 18px; border:none; background:var(--primary);
  color:var(--text-white); border-radius:var(--radius-sm); font-size:13px;
  font-weight:600; cursor:pointer; transition:transform .15s;
}
.memory-add-btn:active { transform:scale(.95); }

/* 思维链浮层 */
.thinking-overlay {
  display:none; position:fixed; inset:0;
  background:var(--bg); z-index:400;
  flex-direction:column; padding-top:calc(var(--safe-top) + 8px);
}
.thinking-overlay.open { display:flex; }
.thinking-overlay-header {
  display:flex; align-items:center; padding:8px 16px 16px; gap:12px;
  border-bottom:1px solid var(--primary-light);
}
.thinking-overlay-header h2 { font-size:18px; flex:1; text-align:center; font-weight:700; }
.thinking-overlay-body {
  flex:1; overflow-y:auto; padding:20px 16px 32px;
  -webkit-overflow-scrolling:touch;
  font-size:15px; line-height:1.7; color:var(--text);
  white-space:pre-wrap; word-break:break-word;
}

/* 空状态 */
.empty-state {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  height:100%; color:var(--text-light); text-align:center; padding:40px;
}
.empty-state .emoji { font-size:48px; margin-bottom:16px; }
.empty-state p { font-size:15px; line-height:1.6; }

/* Toast */
.toast {
  position:fixed; bottom:calc(var(--safe-bottom) + 80px);
  left:50%; transform:translateX(-50%);
  background:var(--text); color:var(--text-white);
  padding:10px 20px; border-radius:20px; font-size:14px;
  z-index:999; opacity:0; transition:opacity .3s; pointer-events:none;
}
.toast.show { opacity:1; }
::-webkit-scrollbar { width:0; }
</style>
</head>
<body>

<!-- 顶栏 -->
<div class="header">
  <button class="header-btn" onclick="toggleSidebar()">☰</button>
  <div class="header-title" id="headerTitle">Little</div>
  <button class="header-btn" onclick="openMemory()">🧠</button>
  <button class="header-btn" onclick="openSettings()" style="margin-left:4px">⚙️</button>
</div>

<!-- 侧栏 -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
<div class="sidebar" id="sidebar">

    <h2>对话</h2>

          <input type="text" id="setModel" placeholder="gpt-4o / claude-sonnet-4-20250514">

    </div>
    <div class="settings-group">

      <div class="setting-row"><label>System Prompt</label><textarea id="setSystemPrompt" placeholder="你是一个可爱的 AI 助手..."></textarea></div>
    </div>
    <div class="settings-group">
      <h3>记忆系统</h3>
      <div class="setting-row">
        <label>自动记忆</label>
        <select id="setAutoMemory">
          <option value="on">开启 - AI 自动提取重要信息</option>

      </div>
      <div class="setting-row"><label>Jina API Key（向量搜索用）</label><input type="password" id="setJinaKey" placeholder="jina_...（可选，不填则用关键词匹配）"></div>
    </div>
    <div class="settings-group">

      <div class="setting-row">

    <div class="settings-group">
      <h3>自定义样式</h3>
      <div class="setting-row">
        <label>自定义 CSS（保存后立即生效）</label>
        <textarea id="setCustomCSS" placeholder="/* 在这里粘贴 CSS 代码 */
/* 例如改背景色: */
/* body { background: #fce4ec; } */
/* 改气泡颜色: */
/* .msg.user .msg-bubble { background: #e91e63; } */" style="min-height:120px;font-family:'SF Mono',Menlo,monospace;font-size:12px;line-height:1.5;"></textarea>
      </div>
    </div>
    <div class="settings-group">
      <h3>关于</h3>
      <div class="setting-row"><label>Little v0.4.0</label><p style="font-size:13px;color:var(--text-light)">一个有记忆的 AI 聊天 PWA 🌸</p></div>
    </div>
    <button class="save-btn" onclick="saveSettings()">保存设置</button>
  </div>
</div>

<!-- 模型选择页 -->
<div class="overlay-page" id="modelPickerPage">
  <div class="overlay-header">
    <button class="overlay-back" onclick="closePage('modelPickerPage')">←</button>
    <h2>选择模型</h2>
  </div>
  <div class="overlay-body">
    <div class="model-search-wrap">
      <input type="text" id="modelSearchInput" placeholder="搜索模型名称..." oninput="filterModels()">
    </div>
    <div id="modelListContainer">
      <div class="model-list-empty">点击设置页的「拉取」按钮获取模型列表</div>
    </div>
  </div>
</div>

<!-- 记忆库页面 -->
<div class="overlay-page" id="memoryPage">
  <div class="overlay-header">
    <button class="overlay-back" onclick="closePage('memoryPage')">←</button>
    <h2>🧠 记忆库</h2>
  </div>
  <div class="overlay-body">
    <div class="memory-add-box">
      <h3>手动添加记忆</h3>
      <div class="memory-add-row">
        <select id="memAddCategory">
          <option value="profile">画像</option>
          <option value="fact" selected>事实</option>
          <option value="warm">暖记忆</option>
          <option value="corridor">便条</option>
        </select>
        <textarea id="memAddText" rows="1" placeholder="输入记忆内容..." oninput="autoResize(this)"></textarea>
      </div>
      <div style="display:flex;justify-content:flex-end;">
        <button class="memory-add-btn" onclick="addManualMemory()">添加</button>
      </div>
    </div>
    <div class="memory-stats" id="memoryStats"></div>
    <div id="memoryList"><div class="memory-empty">还没有记忆哦～</div></div>

</div>

<!-- 思维链浮层 -->
<div class="thinking-overlay" id="thinkingOverlay">
  <div class="thinking-overlay-header">
    <button class="overlay-back" onclick="closeThinking()">✕</button>
    <h2>Thought process</h2>
    <div style="width:36px"></div>
  </div>
  <div class="thinking-overlay-body" id="thinkingOverlayBody"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ==================== 存储层 ====================
const DB = {
  get(k,d=null){try{const v=localStorage.getItem('little_'+k);return v?JSON.parse(v):d}catch{return d}},
  set(k,v){localStorage.setItem('little_'+k,JSON.stringify(v))},
  del(k){localStorage.removeItem('little_'+k)}
};

// ==================== IndexedDB 向量存储 ====================
class VectorStore {
  constructor() {
    this.dbName = 'LittleMemoryDB';
    this.storeName = 'memories';
    this.db = null;
  }

  async open() {
    if (this.db) return this.db;
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(this.dbName, 1);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(this.storeName)) {
          const store = db.createObjectStore(this.storeName, { keyPath: 'id' });
          store.createIndex('category', 'category', { unique: false });
          store.createIndex('time', 'time', { unique: false });
        }
      };
      req.onsuccess = (e) => { this.db = e.target.result; resolve(this.db); };
      req.onerror = (e) => reject(e);
    });
  }

  async add(memory) {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(this.storeName, 'readwrite');
      tx.objectStore(this.storeName).put(memory);
      tx.oncomplete = () => resolve();
      tx.onerror = (e) => reject(e);
    });
  }

  async getAll() {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(this.storeName, 'readonly');
      const req = tx.objectStore(this.storeName).getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = (e) => reject(e);
    });
  }

  async remove(id) {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(this.storeName, 'readwrite');
      tx.objectStore(this.storeName).delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = (e) => reject(e);
    });
  }

  cosineSim(a, b) {
    if (!a || !b || a.length !== b.length) return 0;
    let dot = 0, na = 0, nb = 0;
    for (let i = 0; i < a.length; i++) {
      dot += a[i] * b[i];
      na += a[i] * a[i];
      nb += b[i] * b[i];
    }
    return dot / (Math.sqrt(na) * Math.sqrt(nb) || 1);
  }

  async search(queryVector, topK = 5) {
    const all = await this.getAll();
    if (!queryVector || all.length === 0) return all.slice(0, topK);
    const scored = all
      .filter(m => m.vector && m.vector.length > 0)
      .map(m => ({ ...m, score: this.cosineSim(queryVector, m.vector) }))
      .sort((a, b) => b.score - a.score);
    return scored.slice(0, topK);
  }

  async searchByKeyword(query, topK = 5) {
    const all = await this.getAll();
    const keywords = query.toLowerCase().split(/\s+/);
    const scored = all.map(m => {
      const text = m.text.toLowerCase();
      let score = 0;
      keywords.forEach(kw => { if (text.includes(kw)) score += 1; });
      const daysSince = (Date.now() - m.time) / (1000 * 60 * 60 * 24);
      score += Math.max(0, 1 - daysSince / 365) * 0.3;
      return { ...m, score };
    }).sort((a, b) => b.score - a.score);
    return scored.slice(0, topK);
  }
}

// ==================== Jina Embedding ====================
async function getEmbedding(text) {
  const jinaKey = state.settings.jinaKey;
  if (!jinaKey) return null;
  try {
    const res = await fetch('https://api.jina.ai/v1/embeddings', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + jinaKey
      },
      body: JSON.stringify({
        model: 'jina-embeddings-v3',
        task: 'text-matching',
        dimensions: 256,
        input: [{ text: text }]
      })
    });
    if (!res.ok) return null;
    const data = await res.json();
    return data.data?.[0]?.embedding || null;
  } catch {
    return null;
  }
}

function showToast(msg) {

  t.textContent = msg; t.classList.add('show');

function now() { return new Date(); }
function fmtTime(d) {
  const dt = new Date(d);
  return `${dt.getMonth()+1}/${dt.getDate()} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
}

function getTimeContext() {
  const n = now();
  const wd = ['日','一','二','三','四','五','六'];
  let ctx = `当前时间：${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日 星期${wd[n.getDay()]} ${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;

  if (state.lastChatTime) {
    const diff = Date.now() - state.lastChatTime;
    const mins = Math.floor(diff / 60000);
    if (mins < 5) {
      ctx += '\n（你们刚刚还在聊，话题还热着）';
    } else if (mins < 30) {
      ctx += `\n（用户离开了${mins}分钟，刚回来）`;
    } else if (mins < 180) {
      ctx += `\n（用户离开了${Math.floor(mins/60)}小时${mins%60}分钟）`;
    } else if (mins < 1440) {
      ctx += `\n（距离上次对话已经${Math.floor(mins/60)}小时了）`;
    } else {
      const days = Math.floor(mins / 1440);
      ctx += `\n（距离上次对话已经${days}天了，像隔了很久重新见面）`;
    }
  } else {
    ctx += '\n（这是你们的第一次对话）';
  }
  return ctx;
}

async function retrieveMemories(query) {
  try {
    if (state.settings.jinaKey) {
      const qVec = await getEmbedding(query);
      if (qVec) return await vectorStore.search(qVec, 8);
    }

}

async function buildSystemPrompt(userQuery) {
  const s = state.settings;
  let sys = s.systemPrompt || '';

  // 思维链中文引导（注入到 system prompt，让 thinking 用中文）
  if (s.thinking === 'on') {
    sys += '\n\n请在思考时使用中文。';
  }

  sys += '\n\n' + getTimeContext();

  const memories = await retrieveMemories(userQuery);
  if (memories.length > 0) {
    const cats = { profile: '👤 画像', warm: '🧡 暖记忆', fact: '📝 事实', corridor: '📮 走廊便条' };
    sys += '\n\n[你关于用户的记忆]';
    memories.forEach(m => {
      const tag = cats[m.category] || '📝';
      sys += `\n${tag}：${m.text}`;
    });
    sys += '\n（以上是你记住的事情，像自然知道一样说话，不要说"根据记忆"）';
  }

  if (s.autoMemory === 'on') {
    sys += `\n\n[记忆提取指令]
如果用户在对话中分享了值得长期记住的信息，或者用户明确要求你记住某件事，请在回复最末尾另起一行，用以下格式标记（可多条）：
[MEM|类别|内容]
类别说明：
- profile：用户的身份、名字、职业、年龄等基本信息
- warm：有情感价值的温暖瞬间、用户的心情感受
- fact：具体的事实，如生日、喜好、习惯、重要事件
- corridor：当前话题的关键状态，方便下次接上

示例：[MEM|profile|用户叫小明，是大三学生]
示例：[MEM|fact|用户的猫叫豆豆，是橘猫]
示例：[MEM|warm|用户今天通过了驾照考试，很开心]
示例：[MEM|corridor|用户在纠结要不要考研]

如果没有值得记忆的内容，不要加标记。只记重要的，不要记无聊的寒暄。
当用户明确说"记住这个"、"帮我存起来"之类的话时，一定要提取记忆。`;
  }

  return sys;
}

// ==================== 发送消息 ====================
async function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text || state.generating) return;

  if (!state.settings.apiUrl || !state.settings.apiKey) {
    showToast('请先在设置中配置 API');
    openSettings();
    return;
  }

  if (!state.currentChatId) {
    const id = 'chat_' + Date.now();
    state.chats[id] = { id, title: '新对话', messages: [], created: Date.now() };
    state.currentChatId = id;
  }

  const chat = currentChat();
  chat.messages.push({ role: 'user', content: text, time: Date.now() });

  if (chat.messages.filter(m => m.role === 'user').length === 1) {
    chat.title = text.slice(0, 20) + (text.length > 20 ? '...' : '');
  }

  saveState();
  input.value = '';
  input.style.height = 'auto';
  renderMessages();
  renderChatList();

  state.generating = true;
  document.getElementById('sendBtn').disabled = true;
  const typing = document.getElementById('typing');
  if (typing) typing.classList.add('show');
  scrollToBottom();

  try {
    const systemPrompt = await buildSystemPrompt(text);
    const result = await callAPI(chat, systemPrompt);

    const { cleanReply, newMemories } = extractMemories(result.content);

    const msgObj = { role: 'assistant', content: cleanReply, time: Date.now() };
    // 存储思维链内容
    if (result.thinking) {
      msgObj.thinking = result.thinking;
    }

    chat.messages.push(msgObj);
    state.lastChatTime = Date.now();
    saveState();
    renderMessages();
    renderChatList();

    if (newMemories.length > 0) {
      storeMemories(newMemories);
    }

  } catch (err) {
    showToast('请求失败: ' + err.message);
    console.error(err);
  } finally {
    state.generating = false;
    document.getElementById('sendBtn').disabled = false;
    const t = document.getElementById('typing');
    if (t) t.classList.remove('show');
  }
}

// ==================== API 调用 ====================
async function callAPI(chat, systemPrompt) {
  const s = state.settings;
  const url = s.apiUrl.replace(/\/+$/, '') + '/chat/completions';

  const messages = [{ role: 'system', content: systemPrompt }];
  chat.messages.slice(-30).forEach(m => {
    messages.push({ role: m.role, content: m.content });
  });

  const body = { model: s.model, messages, stream: false };

  const res = await fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + s.apiKey
    },
    body: JSON.stringify(body)
  });

  if (!res.ok) {
    const errText = await res.text();
    throw new Error(`${res.status} ${errText.slice(0, 100)}`);
  }

  const data = await res.json();
  const msg = data.choices?.[0]?.message;
  const content = msg?.content || '(无回复)';

  // 提取思维链：兼容多种中转站返回格式
  let thinking = null;
  if (s.thinking === 'on') {
    // 格式1: message.reasoning_content（OpenAI 兼容格式，DeepSeek 风格）
    if (msg?.reasoning_content) {
      thinking = msg.reasoning_content;
    }
    // 格式2: message.reasoning（有些中转站用这个）
    else if (msg?.reasoning) {
      thinking = msg.reasoning;
    }
    // 格式3: message.thinking（有些中转站用这个）
    else if (msg?.thinking) {
      thinking = msg.thinking;
    }
  }

  return { content, thinking };
}

// ==================== 记忆提取 & 存储 ====================
function extractMemories(reply) {
  const memRegex = /\[MEM\|(\w+)\|(.+?)\]/g;
  let match;
  let cleanReply = reply;
  const newMemories = [];

  while ((match = memRegex.exec(reply)) !== null) {
    newMemories.push({
      id: 'mem_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
      category: match[1].trim(),
      text: match[2].trim(),
      time: Date.now(),
      vector: null
    });
    cleanReply = cleanReply.replace(match[0], '');
  }

  cleanReply = cleanReply.replace(/\n+$/, '').trim();
  return { cleanReply, newMemories };
}

async function storeMemories(memories) {
  let stored = 0;
  for (const mem of memories) {
    try {
      if (state.settings.jinaKey) {
        mem.vector = await getEmbedding(mem.text);
      }
      await vectorStore.add(mem);
      stored++;
    } catch (e) {
      console.error('存储记忆失败:', e);
    }
  }
  if (stored > 0) {
    const catNames = { profile:'画像', warm:'暖记忆', fact:'事实', corridor:'便条' };
    const cats = [...new Set(memories.map(m => catNames[m.category] || m.category))];
    showToast(`记住了 ${stored} 条${cats.join('/')} 🧠`);
  }
}

async function fetchModels() {
  const apiUrl = document.getElementById('setApiUrl').value.trim();
  const apiKey = document.getElementById('setApiKey').value.trim();

  if (!apiUrl || !apiKey) {
    showToast('请先填写接口地址和 API Key');
    return;
  }

  const btn = document.getElementById('fetchModelBtn');
  btn.disabled = true;
  btn.textContent = '拉取中...';

  try {
    const url = apiUrl.replace(/\/+$/, '') + '/models';
    const res = await fetch(url, {
      headers: { 'Authorization': 'Bearer ' + apiKey }
    });

    if (!res.ok) throw new Error(`${res.status}`);

    const data = await res.json();
    let models = [];

    if (Array.isArray(data.data)) {
      models = data.data.map(m => m.id).filter(Boolean);
    } else if (Array.isArray(data)) {
      models = data.map(m => typeof m === 'string' ? m : m.id).filter(Boolean);
    }

    if (models.length === 0) {
      showToast('没有获取到模型');
      return;
    }

    models.sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));
    fetchedModels = models;
    showToast(`获取到 ${models.length} 个模型`);
    renderModelList();
    document.getElementById('modelPickerPage').classList.add('open');

  } catch (err) {
    showToast('拉取失败: ' + err.message);
    console.error(err);
  } finally {
    btn.disabled = false;
    btn.textContent = '拉取';
  }
}

      return;
    }

    const counts = { profile: 0, warm: 0, fact: 0, corridor: 0 };
    all.forEach(m => { counts[m.category] = (counts[m.category] || 0) + 1; });

    statsEl.innerHTML = `
      <div><div class="memory-stat-num">${all.length}</div><div class="memory-stat-label">总记忆</div></div>
      <div><div class="memory-stat-num">${counts.profile}</div><div class="memory-stat-label">画像</div></div>
      <div><div class="memory-stat-num">${counts.fact}</div><div class="memory-stat-label">事实</div></div>
      <div><div class="memory-stat-num">${counts.warm}</div><div class="memory-stat-label">暖记忆</div></div>
      <div><div class="memory-stat-num">${counts.corridor}</div><div class="memory-stat-label">便条</div></div>`;

    all.sort((a, b) => b.time - a.time);

    el.innerHTML = all.map(m => {
      const catNames = { profile:'画像', warm:'暖记忆', fact:'事实', corridor:'便条' };
      return `<div class="memory-item">
        <div>
          <div class="memory-item-text"><span class="memory-tag ${m.category}">${catNames[m.category]||m.category}</span>${escHtml(m.text)}</div>
          <div class="memory-item-meta">${fmtTime(m.time)}${m.vector ? ' · 已向量化' : ''}</div>
        </div>
        <button class="memory-item-del" onclick="deleteMemory('${m.id}')">✕</button>
      </div>`;
    }).join('');
  } catch (e) {
    el.innerHTML = '<div class="memory-empty">加载记忆时出错了 T_T</div>';
    console.error(e);
  }
}

async function deleteMemory(id) {
  await vectorStore.remove(id);
  showToast('已删除记忆');
  renderMemoryList();
}

// ==================== 初始化 ====================
function init() {
  renderChatList();
  renderMessages();
  applyCustomCSS();
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}

init();
</script>
</body>
</html>
